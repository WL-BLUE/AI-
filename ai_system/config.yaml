app:
  name: "AIDA - AI Data Analysis System"
  version: "1.0.0"
  debug: false
  host: "0.0.0.0"
  port: 8000

database:
  driver: "sqlite"
  sqlite_path: "./data/aida.db"
  pool_size: 5
  max_overflow: 10

data_sources:
  sales:
    type: "csv"
    path: "./data/sample/sales_data.csv"
    encoding: "utf-8"
    date_columns:
      - "order_date"
      - "delivery_date"
    refresh_interval_minutes: 60
  inventory:
    type: "csv"
    path: "./data/sample/inventory_data.csv"
    encoding: "utf-8"
    refresh_interval_minutes: 120
  customer:
    type: "csv"
    path: "./data/sample/customer_data.csv"
    encoding: "utf-8"
    refresh_interval_minutes: 1440

data_cleaning:
  missing_value_strategy: "auto"
  outlier_method: "iqr"
  outlier_threshold: 1.5
  duplicate_check_columns: null
  date_format: "%Y-%m-%d"
  numeric_columns: null
  categorical_max_unique: 50

analysis:
  sales_prediction:
    model_type: "auto"
    forecast_days: 30
    confidence_level: 0.95
    seasonality_mode: "multiplicative"
  customer_clustering:
    algorithm: "kmeans"
    max_clusters: 10
    features:
      - "total_spent"
      - "purchase_frequency"
      - "avg_order_value"
      - "days_since_last_purchase"
  inventory_optimization:
    safety_stock_factor: 1.5
    lead_time_days: 7
    service_level: 0.95

report:
  output_dir: "./data/reports"
  template_dir: "./aida/report_generation/templates"
  formats:
    - "html"
    - "pdf"
  language: "zh-CN"
  include_charts: true

visualization:
  theme: "whitegrid"
  color_palette: "Set2"
  figure_size: [12, 8]
  dpi: 150
  interactive: true

security:
  secret_key: "change-this-to-a-secure-secret-key-in-production"
  algorithm: "HS256"
  access_token_expire_minutes: 30
  allowed_roles:
    - "admin"
    - "analyst"
    - "viewer"

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {module}:{function}:{line} | {message}"
  rotation: "50 MB"
  retention: "30 days"
  log_dir: "./logs"
